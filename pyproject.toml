[project]
name = "read-hdf5-electrophysiology"
version = "0.1.0"
description = "Notebook and utilities for reading HDF5 electrophysiology data."
authors = [
    { name = "Project Contributors" }
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.3",
    "pandas>=2.3",
    "pyarrow>=21.0",
    "tables>=3.10",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "jupyterlab>=4.4",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
